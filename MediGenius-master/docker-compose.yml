services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PDF_PATH=/app/data/medical_book.pdf
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
